# One row per thing the driver takes from a document: the datasheet's own section names and printed page
# numbers, the driver API that implements it, and the docs pages that explain it (file names in docs/).
# Pages are the printed page numbers of the SFM4300 (D1, v1.0) unless the row names another document; the SFM3xxx
# datasheets repeat these sections. A fact only one part has is named in the row.
topics:
  - topic: I2C address and bus
    doc: sfm4300
    section: 4 Digital interface description; 4.1 I2C address
    page: 9
    driver: "`I2cInterface`, `I2cPort`, `Config::address`, `PartInfo::address`"
    docs: [hardware, porting, architecture]
  - topic: Command framing and read framing
    doc: sfm4300
    section: 4.2 I2C sequences
    page: 9
    driver: "`Write()`, `Read()`, `detail::ParseWords()`"
    docs: [porting, architecture, contract]
  - topic: CRC-8 of every word
    doc: sfm4300
    section: 4.4 Checksum calculation, Table 14
    page: 15
    driver: "`reg::Crc8()`, `Error::Crc`, `reg::CrcVectorsHold()`"
    docs: [contract, testing, troubleshooting]
  - topic: Start measurement, results and the NACK of a read without data
    doc: sfm4300
    section: 4.3.1 Start continuous measurement
    page: 10
    driver: "`StartMeasurement()`, `ReadSample()`, `Error::NoData`, `Error::DeviceReset`"
    docs: [quickstart, api-guide, architecture, troubleshooting]
  - topic: Status word
    doc: sfm4300
    section: 4.3.2 Read measurement results, Table 5
    page: 11
    driver: "`Sample::status`, `Error::StatusMismatch`"
    docs: [api-guide, contract, troubleshooting]
  - topic: Concentration update
    doc: sfm4300
    section: 4.3.3 Update concentration
    page: 11
    driver: "`UpdateConcentration()`, `Gas::AirO2`, `Sample::o2_permille`"
    docs: [api-guide, configuration]
  - topic: Stop measurement
    doc: sfm4300
    section: 4.3.4 Stop continuous measurement
    page: 12
    driver: "`Stop()`, `State::Measuring`, `State::StateUnknown`"
    docs: [api-guide, architecture, contract]
  - topic: Averaging
    doc: sfm4300
    section: 3.1 Measurement modes; 4.3.5 Configure averaging
    page: 12
    driver: "`SetAveraging()`, `Config::averaging`, `Sample::smoothed`"
    docs: [api-guide, configuration]
  - topic: Scale factor, offset and unit
    doc: sfm4300
    section: 4.3.6 Read scale factor, offset and flow unit; 4.5 Unit conversion
    page: 13
    driver: "`ReadScaling()`, `ScalingInfo`, `Sample::flow_ml_per_min`"
    docs: [api-guide, configuration, contract]
  - topic: Soft reset (general call)
    doc: sfm4300
    section: 4.3.7 Soft reset
    page: 13
    driver: "`SoftReset()`, `WriteGeneralCall()`, `Config::allow_general_call_reset`"
    docs: [api-guide, contract, porting, hardware]
  - topic: Sleep and wake-up
    doc: sfm4300
    section: 4.3.8 Entering and exiting sleep mode
    page: 14
    driver: "`Sleep()`, `WakeUp()`, `State::Asleep`"
    docs: [api-guide, architecture]
  - topic: Product identifier and serial number
    doc: sfm4300
    section: 4.3.9 Read product identifier, Table 13
    page: 15
    driver: "`BeginInitialize()`, `GetProductInfo()`, `Error::DeviceIdMismatch`"
    docs: [quickstart, api-guide, configuration, troubleshooting]
  - topic: IRQn and start-up behaviour
    doc: sfm4300
    section: 3.2 Sensor start-up and warm-up; 3.3 IRQn
    page: 8
    driver: "`Sample::settled`, `Config::require_settled`, `Error::DeviceReset`"
    docs: [hardware, architecture, troubleshooting]
  - topic: Timing (reset, first sample, wake-up, stop)
    doc: sfm4300
    section: 2.4 Timing specification
    page: 5
    driver: "`Config::timing`, `TimingPolicy`, `Wait`, `DelayUs()`"
    docs: [hardware, porting, architecture]
  - topic: Electrical specification and limits
    doc: sfm4300
    section: 2.3 Electrical specification; 2.7 Absolute maximum ratings
    page: 5
    driver: "-"
    docs: [hardware]
  - topic: Connector and pins
    doc: sfm4300
    section: 2.8 Electrical connection, Table 1
    page: 6
    driver: "-"
    docs: [hardware]
  - topic: Fluidics, fittings and outline
    doc: sfm4300
    section: 5 Fluidic specifications; 6 Package outline
    page: 17
    driver: "-"
    docs: [hardware]
  - topic: Gen2 start with a filter argument and its status layout
    doc: sfm3304
    section: Digital interface description (start 0x3603 with filter, status word)
    page: 11
    driver: "`Family::Sf06Gen2`, `Config::filter_enabled`, `Config::filter`"
    docs: [api-guide, architecture]
  - topic: Dual-gas frame of 24 bits
    doc: sfm3505
    section: Digital interface description (24-bit frame, commands)
