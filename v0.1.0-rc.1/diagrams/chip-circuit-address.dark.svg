<svg xmlns="http://www.w3.org/2000/svg" width="760" height="435" viewBox="0 0 760 435" role="img" aria-labelledby="chip-circuit-address-title chip-circuit-address-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-address-title">SFM modules: Address selection</title>
<desc id="chip-circuit-address-desc">Schematic of the SFM modules address selection: the chip with R3 resistor 2.7 kΩ.</desc>
<rect x="0.5" y="0.5" width="759" height="434" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">SFM modules: Address selection</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The ADDR pin with a 2.7 kΩ resistor to GND selects address 0x2C. Open or GND selects</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">0x2A, 1.2 kΩ 0x2B and 5.6 kΩ 0x2D (5 % resistors). ADDR must never go to VDD. Above</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">each MCU wire: the port hook that drives it. Datasheet: 4.1 I2C Address, Table 2, p. 9.</text>
<rect x="32" y="163.3" width="696" height="1" fill="#252F3C"/>
