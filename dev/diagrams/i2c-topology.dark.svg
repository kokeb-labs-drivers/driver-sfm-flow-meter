<svg xmlns="http://www.w3.org/2000/svg" width="640" height="734" viewBox="0 0 640 734" role="img" aria-labelledby="i2c-topology-title i2c-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="i2c-topology-title">Several SFM4300 on one I2C bus</title>
<desc id="i2c-topology-desc">An I2C bus on which an MCU and up to four SFM4300 flow meters share SCL and SDA, each at the address a resistor from its ADDR pin to GND selects, with one pull-up resistor per line.</desc>
<rect x="0.5" y="0.5" width="639" height="733" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">SEVERAL DEVICES</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">Several SFM4300 on one I2C bus</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Datasheet: 4.1 I2C Address, Table 2, p. 9; 4 Digital Interface Description, p.</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">9.</text>
<rect x="32" y="140.4" width="576" height="1" fill="#252F3C"/>
<path d="M542.7 192.6 L542.7 586.6" fill="none" stroke="#D2DAE4" stroke-width="2.2"/>
