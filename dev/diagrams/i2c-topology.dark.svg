<path d="M495 536.6 L542.7 536.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M586.2 192.6 L586.2 586.6" fill="none" stroke="#D2DAE4" stroke-width="2.2"/>
<path d="M495 270.6 L586.2 270.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M495 362.6 L586.2 362.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M495 454.6 L586.2 454.6" fill="none" stroke="#D2DAE4" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M495 546.6 L586.2 546.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M532.7 182.6 L596.2 182.6" fill="none" stroke="#D2DAE4" stroke-width="2"/>
<path d="M542.7 182.6 L542.7 192.6" fill="none" stroke="#D2DAE4" stroke-width="1.6"/>
<path d="M586.2 182.6 L586.2 192.6" fill="none" stroke="#D2DAE4" stroke-width="1.6"/>
<rect x="32" y="244.6" width="463" height="74" rx="10" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<rect x="32" y="252.6" width="4" height="58" rx="2" fill="#60A5FA"/>
<rect x="32" y="336.6" width="463" height="74" rx="10" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="32" y="344.6" width="4" height="58" rx="2" fill="#2BB3A3"/>
<rect x="32" y="428.6" width="463" height="74" rx="10" fill="#151C26" stroke="#6C7889" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="32" y="520.6" width="463" height="74" rx="10" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="32" y="528.6" width="4" height="58" rx="2" fill="#2BB3A3"/>
<rect x="32" y="616.6" width="576" height="86.8" rx="10" fill="#1B232E" stroke="#3A4656" stroke-width="1"/>
<text x="52" y="273.1" font-size="17" font-weight="700" fill="#BFDBFE">MCU</text>
<text x="52" y="300.9" font-size="15" fill="#D2DAE4">I2C controller</text>
<text x="52" y="365.1" font-size="17" font-weight="700" fill="#A7F3E6">SFM4300</text>
<text x="52" y="392.8" font-size="15" fill="#D2DAE4">0x2A, ADDR open or GND</text>
<text x="52" y="457.1" font-size="17" font-weight="700" fill="#E8EDF3">…</text>
<text x="52" y="484.8" font-size="15" fill="#D2DAE4">0x2B with 1.2 kΩ, 0x2C with 2.7 kΩ</text>
<text x="52" y="549.1" font-size="17" font-weight="700" fill="#A7F3E6">SFM4300</text>
<text x="52" y="576.8" font-size="15" fill="#D2DAE4">0x2D, 5.6 kΩ to GND</text>
<text x="542.7" y="166.6" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">SCL</text>
<circle cx="542.7" cy="260.6" r="3.6" fill="#D2DAE4"/>
<circle cx="542.7" cy="352.6" r="3.6" fill="#D2DAE4"/>
<circle cx="542.7" cy="444.6" r="3.6" fill="#D2DAE4"/>
<circle cx="542.7" cy="536.6" r="3.6" fill="#D2DAE4"/>
<text x="586.2" y="166.6" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">SDA</text>
<circle cx="586.2" cy="270.6" r="3.6" fill="#D2DAE4"/>
<circle cx="586.2" cy="362.6" r="3.6" fill="#D2DAE4"/>
<circle cx="586.2" cy="454.6" r="3.6" fill="#D2DAE4"/>
<circle cx="586.2" cy="546.6" r="3.6" fill="#D2DAE4"/>
<rect x="538.7" y="198.6" width="8" height="22" rx="2" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<rect x="582.2" y="198.6" width="8" height="22" rx="2" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="507" y="180.6" font-size="14" font-weight="600" text-anchor="end" fill="#FDE68A">pull-ups to the bus voltage</text>
<text x="46" y="645.1" font-size="17" font-weight="700" fill="#E2E8F0">Limits</text>
<text x="46" y="665.5" font-size="15" fill="#E2E8F0">Four addresses, 0x2A to 0x2D, set by a resistor from ADDR to GND of 5</text>
<text x="46" y="687.2" font-size="15" fill="#E2E8F0">% tolerance at most (4.1, p. 9). Never connect ADDR to VDD (4.1, p. 9).</text>
</svg>
