<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Datasheet: 4.2 I2C Sequences, Figures 2 and 3, p. 9; 4.4 Checksum</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">Calculation, Table 14, p. 15.</text>
