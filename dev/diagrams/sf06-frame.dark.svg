<svg xmlns="http://www.w3.org/2000/svg" width="640" height="664" viewBox="0 0 640 664" role="img" aria-labelledby="sf06-frame-title sf06-frame-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="sf06-frame-title">Command and read sequences</title>
<desc id="sf06-frame-desc">The two I2C sequences of the SFM4300: a write of a 16-bit command with a 16-bit argument and its CRC byte, and a read of 16-bit words, each followed by a CRC byte the sensor sends.</desc>
