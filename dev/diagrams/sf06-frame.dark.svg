<text x="32" y="185.8" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">Write</text>
<text x="136.1" y="185.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">Adr + W</text>
<text x="220.8" y="185.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">Cmd MSB</text>
<text x="305.5" y="185.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">Cmd LSB</text>
<text x="390.2" y="185.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">Arg MSB</text>
<text x="474.9" y="185.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">Arg LSB</text>
<text x="559.6" y="185.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">CRC</text>
<text x="32" y="233.8" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">Read</text>
<text x="136.1" y="233.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">Adr + R</text>
<text x="220.8" y="233.5" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">Data MSB</text>
<text x="305.5" y="233.5" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">Data LSB</text>
<text x="390.2" y="233.5" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">CRC</text>
<text x="517.3" y="233.5" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">CRC</text>
<rect x="449.7" y="211.4" width="8" height="34" rx="0" fill="#0E131A"/>
<path d="M446.7 244.4 L452.7 212.4" fill="none" stroke="#D2DAE4" stroke-width="1.4"/>
<path d="M454.7 244.4 L460.7 212.4" fill="none" stroke="#D2DAE4" stroke-width="1.4"/>
<text x="32" y="276.9" font-size="17" font-weight="700" fill="#E8EDF3">Values</text>
<text x="32" y="313.3" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">command</text>
<text x="608" y="313.3" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 16 bit</text>
<text x="32" y="333.5" font-size="15" fill="#D2DAE4">Command length</text>
<text x="32" y="353.7" font-size="14" fill="#9AA6B5">Datasheet 4.2 I2C Sequences, Figures 2 and 3, p. 9</text>
<text x="32" y="386.1" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">word</text>
<text x="608" y="386.1" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 16 bit</text>
<text x="32" y="406.4" font-size="15" fill="#D2DAE4">Argument or data word, each followed by its CRC</text>
<text x="32" y="426.5" font-size="14" fill="#9AA6B5">Datasheet 4.2 I2C Sequences, Figures 2 and 3, p. 9</text>
<text x="32" y="459" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">CRC</text>
<text x="608" y="459" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 8 bit</text>
<text x="32" y="479.2" font-size="15" fill="#D2DAE4">CRC-8 over the two bytes before it, polynomial 0x31, init 0xFF</text>
<text x="32" y="499.4" font-size="14" fill="#9AA6B5">Datasheet 4.4 Checksum Calculation, Table 14, p. 15</text>
<text x="46" y="553.5" font-size="17" font-weight="700" fill="#E2E8F0">Notes</text>
<text x="46" y="574" font-size="15" fill="#E2E8F0">Each transfer runs from START to STOP and every byte is</text>
<text x="46" y="595.7" font-size="15" fill="#E2E8F0">acknowledged. The host may end a read with NACK and STOP after any</text>
<text x="46" y="617.5" font-size="15" fill="#E2E8F0">CRC byte. CRC(0xBEEF) = 0x92 checks an implementation.</text>
</svg>
