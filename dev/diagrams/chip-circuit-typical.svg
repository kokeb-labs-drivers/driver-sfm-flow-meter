<svg xmlns="http://www.w3.org/2000/svg" width="856" height="483" viewBox="0 0 856 483" role="img" aria-labelledby="chip-circuit-typical-title chip-circuit-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-typical-title">SFM modules: Typical application</title>
<desc id="chip-circuit-typical-desc">Schematic of the SFM modules typical application: the chip with U2 MCU, R1 resistor Rp, R2 resistor Rp; the MCU wires carry the port hooks Write(), Read().</desc>
<rect x="0.5" y="0.5" width="855" height="482" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">SFM modules: Typical application</text>
<text x="32" y="103.8" font-size="15" fill="#566070">The sensor on an MCU's I2C bus. The datasheet requires pull-ups to the bus voltage but gives no value,</text>
<text x="32" y="125.5" font-size="15" fill="#566070">so the resistors are marked as unverified. IRQn and ADDR stay open. Above each MCU wire: the port</text>
<text x="32" y="147.3" font-size="15" fill="#566070">hook that drives it. Datasheet: 4 Digital Interface Description, p. 9.</text>
