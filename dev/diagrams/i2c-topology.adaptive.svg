<text x="52" y="273.1" font-size="17" font-weight="700" class="fk-f-blue-text">MCU</text>
<text x="52" y="300.9" font-size="15" class="fk-f-ink2">I2C controller</text>
<text x="52" y="365.1" font-size="17" font-weight="700" class="fk-f-teal-text">SFM4300</text>
<text x="52" y="392.8" font-size="15" class="fk-f-ink2">0x2A, ADDR open or GND</text>
<text x="52" y="457.1" font-size="17" font-weight="700" class="fk-f-ink">…</text>
<text x="52" y="484.8" font-size="15" class="fk-f-ink2">0x2B with 1.2 kΩ, 0x2C with 2.7 kΩ</text>
<text x="52" y="549.1" font-size="17" font-weight="700" class="fk-f-teal-text">SFM4300</text>
<text x="52" y="576.8" font-size="15" class="fk-f-ink2">0x2D, 5.6 kΩ to GND</text>
<text x="542.7" y="166.6" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">SCL</text>
