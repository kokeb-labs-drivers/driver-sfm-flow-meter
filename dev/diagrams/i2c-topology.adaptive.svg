<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">SEVERAL DEVICES</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">Several SFM4300 on one I2C bus</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Datasheet: 4.1 I2C Address, Table 2, p. 9; 4 Digital Interface Description, p.</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">9.</text>
