<rect x="582.2" y="198.6" width="8" height="22" rx="2" stroke-width="1.4" class="fk-f-amber-tint fk-s-amber-strong"/>
<text x="507" y="180.6" font-size="14" font-weight="600" text-anchor="end" class="fk-f-amber-text">pull-ups to the bus voltage</text>
<text x="46" y="645.1" font-size="17" font-weight="700" class="fk-f-slate-text">Limits</text>
<text x="46" y="665.5" font-size="15" class="fk-f-slate-text">Four addresses, 0x2A to 0x2D, set by a resistor from ADDR to GND of 5</text>
<text x="46" y="687.2" font-size="15" class="fk-f-slate-text">% tolerance at most (4.1, p. 9). Never connect ADDR to VDD (4.1, p. 9).</text>
