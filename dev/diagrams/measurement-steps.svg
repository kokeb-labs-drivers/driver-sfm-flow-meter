<svg xmlns="http://www.w3.org/2000/svg" width="684" height="843" viewBox="0 0 684 843" role="img" aria-labelledby="measurement-steps-title measurement-steps-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="measurement-steps-title">Start, wait and read one measurement</title>
<desc id="measurement-steps-desc">One measurement with the SFM executor: StartMeasurement reads the scale factors and starts the sensor, your code sleeps the returned wait and polls, and ReadSample then reads nine bytes, checks each CRC and returns a sample.</desc>
