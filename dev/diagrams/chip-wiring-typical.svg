<text x="50" y="489.7" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="513.1" font-size="17" fill="#9F1239">+3V3: VDD; also U2.VDD · GND: GND; also U2.GND</text>
<text x="50" y="582.7" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="606.1" font-size="17" fill="#334155">Support parts: 2 resistors around the supplies (values in the full schematic). Not wired in this circuit (2): ADDR, IRQn.</text>
<text x="32" y="652.2" font-size="16" fill="#566070">* Not confirmed in the datasheet: R1: no value is given in the datasheet; R2: no value is given in the datasheet.</text>
