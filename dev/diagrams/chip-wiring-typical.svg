<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="719" viewBox="0 0 1200 719" role="img" aria-labelledby="chip-wiring-typical-title chip-wiring-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-typical-title">Wiring: Typical application</title>
<desc id="chip-wiring-typical-desc">Wiring of the SFM flow meter for the Typical application: MCU I2C SDA to SDA (Write(), Read()); MCU I2C SCL to SCL (Write(), Read()). Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="718" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">Wiring: Typical application</text>
<text x="32" y="115.4" font-size="18" fill="#566070">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#566070">Hardware page. Datasheet: 4 Digital Interface Description, p. 9.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#E2E7EE"/>
<path d="M483.7 280.3 L662.3 280.3" fill="none" stroke="#2563EB" stroke-width="2.2"/>
<path d="M483.7 365.9 L662.3 365.9" fill="none" stroke="#2563EB" stroke-width="2.2"/>
