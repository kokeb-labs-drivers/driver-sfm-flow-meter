---
# Model of the figure 'i2c-topology'. Edit this file; `kokeb-docs figures` draws it. Never edit the SVGs.
# Section 4.1 of the SFM4300 data sheet: the ADDR pin selects one of four addresses with a resistor to GND.
kind: topology
id: i2c-topology
title: Several SFM4300 on one I2C bus
kicker: Several devices
alt: >-
  An I2C bus on which an MCU and up to four SFM4300 flow meters share SCL and SDA, each at the address a resistor from
  its ADDR pin to GND selects, with one pull-up resistor per line.
reads: >-
  The MCU on top and the SFM4300 flow meters under it connect to the rails SCL and SDA on the right; the dashed card
  stands for the meters in between. The first SFM4300 answers at 0x2A with ADDR open and the last at 0x2D with
  5.6 kΩ to GND, and one pull-up per line ties the bus to the bus voltage.
print: landscape
sources:
  - docs/model/i2c-topology.topology.yml
style: bus
host: {label: MCU, detail: I2C controller}
nodes:
  - {label: SFM4300, address: "0x2A, ADDR open or GND", ref: address}
  - {more: true, label: "…", detail: "0x2B with 1.2 kΩ, 0x2C with 2.7 kΩ", ref: address}
  - {label: SFM4300, address: "0x2D, 5.6 kΩ to GND", ref: address}
shared: [SCL, SDA]
pullups: {label: pull-ups to the bus voltage, ref: bus}
facts:
  - {text: "Four addresses, 0x2A to 0x2D, set by a resistor from ADDR to GND of 5 % tolerance at most", ref: address}
  - {text: "Never connect ADDR to VDD", ref: address}
