<svg xmlns="http://www.w3.org/2000/svg" width="640" height="535" viewBox="0 0 640 535" role="img" aria-labelledby="i2c-timing-title i2c-timing-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="i2c-timing-title">I2C address byte</title>
<desc id="i2c-timing-desc">I2C address byte of the SFM4300: the start condition, the 7-bit default address 0x2A with the write bit and the acknowledge, with the typical and maximum clock the data sheet gives.</desc>
