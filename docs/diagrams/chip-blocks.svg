<text x="136" y="162.8" font-size="13" font-weight="700" fill="#334155">SFM MODULES</text>
<text x="249.9" y="162.8" font-size="12" fill="#334155">JST NSH 6-pin 1.0 mm connector</text>
<text x="180" y="228.6" font-size="15" font-weight="700" fill="#1E429F">I2C interface*</text>
<text x="180" y="253.4" font-size="13" fill="#2B3442">address 0x2A to 0x2D from</text>
<text x="180" y="272.2" font-size="13" fill="#2B3442">ADDR</text>
<text x="508" y="228.6" font-size="15" font-weight="700" fill="#7A360E">Commands and CRC*</text>
<text x="508" y="253.4" font-size="13" fill="#2B3442">16-bit commands, CRC-8 per</text>
<text x="508" y="272.2" font-size="13" fill="#2B3442">word</text>
<text x="836" y="228.6" font-size="15" font-weight="700" fill="#0B5F59">Thermal flow sensor*</text>
<text x="836" y="253.4" font-size="13" fill="#2B3442">heater, flow, temperature</text>
<text x="508" y="364.6" font-size="15" font-weight="700" fill="#8A3C0B">Result-ready line*</text>
<text x="508" y="389.4" font-size="13" fill="#2B3442">IRQn, low until read</text>
<text x="180" y="364.6" font-size="15" font-weight="700" fill="#334155">Power and reset*</text>
<text x="180" y="389.4" font-size="13" fill="#2B3442">power-up, soft reset, sleep</text>
<text x="106" y="222.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">SDA  2</text>
<text x="106" y="246.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">SCL  5</text>
