<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="819" viewBox="0 0 1200 819" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">SFM flow meter</title>
<desc id="chip-hero-desc">Overview of the SFM flow meter, a family of digital gas mass flow sensors on I2C: each part reports the flow of its calibrated gases and gas mixtures and its own temperature as 16-bit words, and the reference SFM4300 does so for air, oxygen, nitrous oxide and carbon dioxide. A MCU talks to it over I2C; it reads back Gas flow, Sensor temperature. Headline figures: 20 or 50 slm SFM4300 flow range; 3.0 to 5.5 V SFM4300 supply; 1 MHz I2C clock at most; 2 kHz flow update rate, no averaging.</desc>
