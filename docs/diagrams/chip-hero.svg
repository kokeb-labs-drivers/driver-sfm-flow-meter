<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">DIGITAL GAS MASS FLOW METER</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">SFM flow meter</text>
<text x="32" y="115.4" font-size="18" fill="#566070">What talks to it, what it drives and what it reads back, with its headline numbers. Datasheet: Product Summary, p. 1.</text>
