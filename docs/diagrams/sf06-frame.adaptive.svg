<text x="32" y="276.9" font-size="17" font-weight="700" class="fk-f-ink">Values</text>
<text x="32" y="313.3" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">command</text>
<text x="608" y="313.3" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">typ 16 bit</text>
<text x="32" y="333.5" font-size="15" class="fk-f-ink2">Command length</text>
<text x="32" y="353.7" font-size="14" class="fk-f-muted">Datasheet 4.2 I2C Sequences, Figures 2 and 3, p. 9</text>
<text x="32" y="386.1" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">word</text>
<text x="608" y="386.1" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">typ 16 bit</text>
<text x="32" y="406.4" font-size="15" class="fk-f-ink2">Argument or data word, each followed by its CRC</text>
<text x="32" y="426.5" font-size="14" class="fk-f-muted">Datasheet 4.2 I2C Sequences, Figures 2 and 3, p. 9</text>
<text x="32" y="459" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">CRC</text>
<text x="608" y="459" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">typ 8 bit</text>
<text x="32" y="479.2" font-size="15" class="fk-f-ink2">CRC-8 over the two bytes before it, polynomial 0x31, init 0xFF</text>
<text x="32" y="499.4" font-size="14" class="fk-f-muted">Datasheet 4.4 Checksum Calculation, Table 14, p. 15</text>
<text x="46" y="553.5" font-size="17" font-weight="700" class="fk-f-slate-text">Notes</text>
<text x="46" y="574" font-size="15" class="fk-f-slate-text">Each transfer runs from START to STOP and every byte is</text>
<text x="46" y="595.7" font-size="15" class="fk-f-slate-text">acknowledged. The host may end a read with NACK and STOP after any</text>
<text x="46" y="617.5" font-size="15" class="fk-f-slate-text">CRC byte. CRC(0xBEEF) = 0x92 checks an implementation.</text>
