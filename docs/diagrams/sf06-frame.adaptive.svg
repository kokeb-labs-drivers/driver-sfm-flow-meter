<text x="32" y="185.8" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">Write</text>
<text x="136.1" y="185.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">Adr + W</text>
<text x="220.8" y="185.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">Cmd MSB</text>
<text x="305.5" y="185.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">Cmd LSB</text>
<text x="390.2" y="185.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">Arg MSB</text>
<text x="474.9" y="185.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">Arg LSB</text>
<text x="559.6" y="185.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">CRC</text>
<text x="32" y="233.8" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">Read</text>
<text x="136.1" y="233.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">Adr + R</text>
<text x="220.8" y="233.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">Data MSB</text>
<text x="305.5" y="233.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">Data LSB</text>
<text x="390.2" y="233.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">CRC</text>
<text x="517.3" y="233.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">CRC</text>
