<text x="136" y="162.8" font-size="13" font-weight="700" fill="#E2E8F0">SFM MODULES</text>
<text x="249.9" y="162.8" font-size="12" fill="#E2E8F0">JST NSH 6-pin 1.0 mm connector</text>
<text x="180" y="228.6" font-size="15" font-weight="700" fill="#BFDBFE">I2C interface*</text>
<text x="180" y="253.4" font-size="13" fill="#D2DAE4">address 0x2A to 0x2D from</text>
<text x="180" y="272.2" font-size="13" fill="#D2DAE4">ADDR</text>
<text x="508" y="228.6" font-size="15" font-weight="700" fill="#F8D27A">Commands and CRC*</text>
<text x="508" y="253.4" font-size="13" fill="#D2DAE4">16-bit commands, CRC-8 per</text>
<text x="508" y="272.2" font-size="13" fill="#D2DAE4">word</text>
<text x="836" y="228.6" font-size="15" font-weight="700" fill="#A7F3E6">Thermal flow sensor*</text>
<text x="836" y="253.4" font-size="13" fill="#D2DAE4">heater, flow, temperature</text>
<text x="508" y="364.6" font-size="15" font-weight="700" fill="#FDE68A">Result-ready line*</text>
<text x="508" y="389.4" font-size="13" fill="#D2DAE4">IRQn, low until read</text>
<text x="180" y="364.6" font-size="15" font-weight="700" fill="#E2E8F0">Power and reset*</text>
<text x="180" y="389.4" font-size="13" fill="#D2DAE4">power-up, soft reset, sleep</text>
<text x="106" y="222.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#E8EDF3">SDA  2</text>
