<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1002" viewBox="0 0 1200 1002" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the SFM flow meter does</title>
<desc id="chip-capabilities-desc">Capability map of the SFM flow meter: Flow measurement (supported): Starts continuous measurement and reads each CRC-checked sample as a flow in millilitres per minute; Gas and gas mixture (supported): Picks the calibrated gas or an oxygen mixture, and changes the mixture without stopping the sensor; Temperature (supported): Reads the sensor temperature from the sample where the part sends it, or by a pointer sequence; Averaging (supported): Averages until the read, or over a fixed number of the 2 kHz measurements; Scale factor and offset (supported): Reads the sensor's scale factor, offset and unit and checks them against the datasheet table; Product identification (supported): Reads the product identifier or serial number and matches it to one of the 32 variants; Sleep and reset (supported): Stops the measurement, sleeps and wakes the sensor, and resets it by command, reset pin or supply cycle; Status and fault checks (supported): Checks each sample's status word and range, and reports a reset, a stale value or a CRC error; Result-ready line (not covered): IRQn goes low when a reading is ready; the driver polls over I2C and leaves the pin open.</desc>
